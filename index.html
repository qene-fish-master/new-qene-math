<script>

/* ===== 運算式解析(正確處理優先順序) ===== */
function calc(s){s=s.replace(/×|x|X|\*/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/−/g,'-').replace(/\s+/g,'');if(!s)throw Error('請輸入算式');let i=0;

throw Error('算式格式錯誤')}
const r=ex();if(i<s.length)throw Error('算式格式錯誤');if(!isFinite(r))throw Error('結果無效');return r}

function num(t){t=t.trim().replace(/\s/g,'');const m=/^(-?\d+)\/(\d+)$/.exec(t);if(m)return+m[1]/+m[2];return/^-?(\d+\.?\d*|\.\d+)$/.test(t)?+t:NaN}

const x=num(u),y=num(a);return!isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<=1e-9*Math.max(1,Math.abs(y))}

function stepsFor(op,a,b,r){if(op=='+'||op=='-')return['對齊位數,由個位往左逐位'+(op=='+'?'相加(滿10進位)':'相減(不夠向前一位借10)'),`${a} ${op} ${b} = ${r}`];

const BK=['qene.set','qene.rec','qene.ses','qene.notes','qene.wrong'];
const put=(k,v)=>{try{localStorage.setItem(kk(k),JSON.stringify(v));return true}catch{return false}};
async function saveFile(name,text){const f=new File([text],name,{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name=='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function importFile(f){try{if(f.size>30e6)throw Error('檔案太大');
let j=JSON.parse(await f.text());if(j&&j.app=='qene'&&j.data)j=j.data;
if(!j||typeof j!='object'||Array.isArray(j))throw Error('格式不符,這不是青魚計算的備份檔');
const inc={};BK.forEach(k=>{if(!(k in j))return;const v=j[k];if(k=='qene.set'){if(v&&typeof v=='object'&&!Array.isArray(v))inc[k]=v}else if(Array.isArray(v))inc[k]=v.filter(x=>x&&typeof x=='object')});
if(!Object.keys(inc).length)throw Error('檔案裡沒有可匯入的資料');
const mode=$('#imode').value,n=k=>(inc[k]||[]).length;
if(!await ask(`匯入「${f.name}」\n練習紀錄 ${n('qene.rec')} 筆、測驗場次 ${n('qene.ses')} 場、筆記 ${n('qene.notes')} 篇、錯題 ${n('qene.wrong')} 題${inc['qene.set']?'、含設定':''}\n\n方式:${mode=='merge'?'合併(保留目前資料,再加入檔案內容)':'覆蓋(檔案內有的項目會取代目前資料)'}\n確定要匯入嗎?`))return;
let ok=true;
for(const k of BK){if(!(k in inc))continue;let v=inc[k];
if(k=='qene.set'){const o={};Object.keys(DEFS).forEach(d=>{if(!(d in v))return;if(d=='home'?(v[d]===null||Array.isArray(v[d])):typeof v[d]==typeof DEFS[d])o[d]=v[d]});v=mode=='merge'?{...S,...o}:{...DEFS,...o}}
else if(k=='qene.wrong'){v=v.filter(w=>typeof w.t=='string');if(mode=='merge'){const m=new Map(LS.get(k,[]).map(w=>[w.t,w]));v.forEach(w=>{const c=m.get(w.t);m.set(w.t,c?{...c,n:Math.max(c.n||1,w.n||1),ts:Math.max(c.ts||0,w.ts||0)}:w)});v=[...m.values()]}v=v.sort((x,y)=>(y.ts||0)-(x.ts||0)).slice(0,200)}
else{if(mode=='merge'){const m=new Map();[...LS.get(k,[]),...v].forEach(x=>m.set(JSON.stringify(x),x));v=[...m.values()]}if(k=='qene.rec'||k=='qene.ses')v=v.sort((x,y)=>(x.t||0)-(y.t||0));if(k=='qene.rec')v=v.slice(-3000)}
if(!put(k,v))ok=false}
S=Object.assign({},DEFS,LS.get('qene.set',{}));applySet();renderSet();renderHomeEd();renderKpEd();renderNotes();
alert(ok?'匯入完成!':'匯入失敗:瀏覽器儲存空間不足,部分資料沒有寫入')}catch(err){alert('匯入失敗:'+(err instanceof SyntaxError?'這不是有效的備份檔(JSON 格式錯誤)':err.message||'無法讀取檔案'))}}
function renderSet(){const b=$('#setb');b.innerHTML=`<p><label><input type="checkbox" id="s1" ${S.dark?'checked':''}> 深色模式</label></p><p><label><input type="checkbox" id="s2" ${S.sound?'checked':''}> 音效</label></p><p>快速計算預設每題秒數 <input type="number" id="s3" min="3" value="${S.secs}"></p><p>答題輸入方式 <select id="s11"><option value="pad" ${S.kb!='sys'?'selected':''}>內建小鍵盤(永遠顯示)</option><option value="sys" ${S.kb=='sys'?'selected':''}>系統鍵盤</option></select></p><p>題目字體 <select id="s4">${[16,20,26,32].map(v=>`<option ${v==S.fs?'selected':''}>${v}</option>`).join('')}</select> px</p><p><label><input type="checkbox" id="s5" ${S.auto?'checked':''}> 答題後自動跳下一題(快速/練習模式)</label></p><p><label><input type="checkbox" id="s6" ${S.showAns?'checked':''}> 答錯時顯示正確答案</label></p><p>筆記預設顏色 <input type="color" id="s7" value="${S.pen}"></p><p><label><input type="checkbox" id="s8" ${S.autoSave?'checked':''}> 草稿自動儲存(下次開啟自動還原)</label></p><p><label><input type="checkbox" id="s9" ${S.clearNext?'checked':''}> 換下一題時自動清空草稿</label></p><p>筆刷預設粗細 <input type="range" id="s10" min="1" max="40" value="${S.penW}"></p><div class="row"><button id="ex">匯出資料</button><button class="alt" id="im">匯入資料</button><button class="alt" id="cl">清除練習資料</button></div><p>匯入方式 <select id="imode"><option value="merge">合併(保留目前資料)</option><option value="replace">覆蓋(以檔案為準)</option></select></p><input type="file" id="imf" accept=".json,application/json" hidden><p style="color:var(--mut)">青魚計算 Qene Calculate v1.6｜資料只存在本機瀏覽器(localStorage)｜可安裝成 App 並離線使用:iPad/iPhone 用 Safari「分享 → 加入主畫面」,Android/電腦 Chrome 用「安裝應用程式」</p>`;
const bind=(id,k,f=v=>v)=>$('#'+id).onchange=e=>{S[k]=f(e.target.type=='checkbox'?e.target.checked:e.target.value);applySet();if(k=='secs')$('#quick .secs').value=S.secs};
bind('s1','dark');bind('s2','sound');bind('s3','secs',v=>Math.max(3,+v||15));bind('s4','fs',Number);bind('s5','auto');bind('s6','showAns');bind('s7','pen');bind('s8','autoSave');bind('s9','clearNext');bind('s10','penW',Number);bind('s11','kb');$('#s7').addEventListener('change',()=>$$('.pc').forEach(e=>e.value=S.pen));$('#s10').addEventListener('change',()=>$$('.pw').forEach(e=>e.value=S.penW));
$('#ex').onclick=()=>{const d={};BK.forEach(k=>{const v=LS.get(k,null);if(v!=null)d[k]=v});saveFile(`qene-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'qene',version:1,exportedAt:new Date().toISOString(),data:d}))};
$('#im').onclick=()=>$('#imf').click();$('#imf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)};
$('#cl').onclick=async()=>{if(await ask('確定清除所有練習紀錄、錯題本與筆記?(設定會保留)')){['qene.rec','qene.ses','qene.notes','qene.wrong','qene.draft.main','qene.draft.run'].forEach(k=>localStorage.removeItem(kk(k)));renderNotes()}}}
function openRun(o){$('#fs').hidden=false;document.body.style.overflow='hidden';$('#fsT').textContent=o.mode+(o.opName?' · '+o.opName:'');const c=makeCanvas($('#fsCv'),true,'run');o.onNext=()=>{if(S.clearNext)c.clear()};run($('#fsRun'),o)}
function closeRun(){clearInterval($('#fsRun')._iv);$('#fs').hidden=true;document.body.style.overflow='';if(!$('#wrong').hidden)renderWrong()}
/* ===== 導覽與初始化 ===== */
const HOME=[['quick','⚡','快速計算','限時心算,練速度','#f59e0b'],['slow','🐢','慢速計算','寫過程、查哪步錯','#10b981'],['prac','📘','數學練習','國小一~六年級','#3b82f6'],['scratch','✏️','手寫草稿','觸控筆與手指','#8b5cf6'],['adv','🧮','進階計算','混合運算、方程式','#ec4899'],['wrong','📕','錯題本','答錯的題自動收集,重練到會','#ef4444'],['tools','🧰','數學工具箱','10 種實用工具','#06b6d4'],['stats','📊','學習紀錄','統計與圖表','#f97316'],['set','⚙️','系統設定','外觀與資料','#64748b']];
function go(id){$$('main>section').forEach(s=>s.hidden=s.id!=id);if(id=='home')renderHome();if(id=='stats')renderStats();if(id=='wrong')renderWrong();if(id=='set'){renderSet();renderHomeEd();renderKpEd()}window.scrollTo(0,0)}
function renderNotes(){const n=LS.get('qene.notes',[]);$('#notes').innerHTML=n.map((x,i)=>`<div class="row">${new Date(x.t).toLocaleString()} <button class="alt" data-l="${i}">開啟</button><button class="alt" data-d="${i}">刪除</button></div>`).join('')||'尚無保存的筆記'}
const CS=[110,160,280];
function layout(){const base=HOME.map(h=>({id:h[0],icon:h[1],name:h[2],desc:h[3],color:h[4],hide:false})),out=[];(S.home||[]).forEach(o=>{const b=base.find(x=>x.id==o.id);if(b&&!out.find(x=>x.id==b.id))out.push({...b,...o,desc:b.desc})});base.forEach(b=>{if(!out.find(x=>x.id==b.id)){const k=out.findIndex(x=>x.id=='set');k>=0?out.splice(k,0,b):out.push(b)}});return out}
function renderHome(){const R=LS.get('qene.rec',[]),d0=new Date().setHours(0,0,0,0),T=R.filter(r=>r.t>=d0),ok=T.filter(r=>r.ok).length,h=new Date().getHours(),W=wrongList().length,L=layout().filter(x=>!x.hide);
$('#home').innerHTML=`<div class="hero"><h2>${h<12?'早安':h<18?'午安':'晚安'}!今天也來練習吧 🐟</h2><div class="st"><div><b>${T.length}</b><small>今日題數</small></div><div><b>${T.length?Math.round(ok/T.length*100):0}%</b><small>今日正確率</small></div><div><b>${R.length}</b><small>累計題數</small></div></div></div><div class="grid" data-cs="${+S.cardSize||2}" style="grid-template-columns:repeat(auto-fit,minmax(${CS[(+S.cardSize||2)-1]||160}px,1fr))">`+(L.map(x=>`<button class="hb" onclick="go('${x.id}')"><span class="ic" style="background:${esc(x.color)}">${esc(x.icon)}</span><span><b>${esc(x.name)}</b><small>${x.id=='wrong'&&W?W+' 題待複習':x.desc}</small></span></button>`).join('')||'<div class="card">所有卡片都被隱藏了,請到 ⚙️ 設定 →「首頁排列」重新顯示。</div>')+`</div>`}
/* 首頁排列:只在設定頁內 */
function renderHomeEd(){const L=layout();$('#homeEd').innerHTML=`<h3>🏠 首頁排列</h3><small>調整首頁卡片的順序、名稱、圖示、顏色與顯示/隱藏。</small>`+L.map((x,i)=>`<div class="ed" style="opacity:${x.hide?.55:1}"><div class="e1"><input class="ei" style="background:${esc(x.color)}" data-a="ic" data-id="${x.id}" value="${esc(x.icon)}" aria-label="圖示"><input class="en" data-a="nm" data-id="${x.id}" value="${esc(x.name)}" maxlength="12" aria-label="名稱"></div><div class="e2"><input type="color" data-a="c" data-id="${x.id}" value="${esc(x.color)}" aria-label="顏色"><button class="alt" data-a="u" data-id="${x.id}" ${i?'':'disabled'}>▲ 上移</button><button class="alt" data-a="d" data-id="${x.id}" ${i<L.length-1?'':'disabled'}>▼ 下移</button><button class="alt" data-a="h" data-id="${x.id}">${x.hide?'顯示':'隱藏'}</button></div></div>`).join('')+`<div class="row"><label>卡片大小 <select data-a="s">${['小','中','大'].map((t,i)=>`<option value="${i+1}" ${(+S.cardSize||2)==i+1?'selected':''}>${t}</option>`).join('')}</select></label><button class="alt" data-a="reset">還原預設</button></div>`}
function edAct(a,id,val){const L=layout(),i=L.findIndex(x=>x.id==id);
if(a=='reset'){S.home=null;S.cardSize=2;applySet();return renderHomeEd()}
if(a=='s'){S.cardSize=+val;applySet();return}
if(i<0)return;
if(a=='u'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
if(a=='d'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
if(a=='h')L[i].hide=!L[i].hide;
if(a=='c')L[i].color=val;
if(a=='nm'){const n=val.trim().slice(0,12);if(n)L[i].name=n}
if(a=='ic'){const ic=Array.from(val.trim()).slice(0,2).join('');if(ic)L[i].icon=ic}
S.home=L;applySet();if(a=='u'||a=='d'||a=='h')renderHomeEd()}
['quick','slow'].forEach(id=>{const r=$('#'+id),slow=id=='slow';r.querySelector('.cfg').innerHTML=cfgHTML();r.querySelector('.start').onclick=()=>{const c=cfgRead(r);if(!c)return;openRun({mode:slow?'慢速':'快速',slow,n:+r.querySelector('.n').value||10,secs:slow?0:+r.querySelector('.secs').value||0,timer:slow?false:r.querySelector('.tm').checked,gen:()=>basicGen(c)})}});
$('#quick .secs').value=S.secs;
const g=$('#prac .g'),u=$('#prac .u');g.innerHTML=Object.keys(GR).map(k=>`<option value="${k}">${k} 年級</option>`).join('');const fu=()=>u.innerHTML=Object.keys(GR[g.value]).map(k=>`<option>${k}</option>`).join('');g.onchange=fu;fu();
$('#prac .start').onclick=()=>{const d=+$('#prac .d').value,gn=GR[g.value][u.value];openRun({mode:'國小'+g.value+'年級',opName:u.value,n:+$('#prac .n').value||10,secs:0,gen:()=>gn(d)})};
$('#adv .t').innerHTML=Object.keys(ADV).map(k=>`<option>${k}</option>`).join('');
$('#adv .start').onclick=()=>{const k=$('#adv .t').value;openRun({mode:'進階',ops:true,n:+$('#adv .n').value||10,secs:0,gen:()=>{const q=ADV[k]();if(k!='隨機綜合題')q.op=k;return q}})};
const main=makeCanvas($('#scHost'),true,'main');$('#scHost').addEventListener('saved',renderNotes);
$('#notes').onclick=e=>{const n=LS.get('qene.notes',[]);if(e.target.dataset.l!=null)main.load(n[+e.target.dataset.l].s);if(e.target.dataset.d!=null){n.splice(+e.target.dataset.d,1);LS.set('qene.notes',n);renderNotes()}};
$('#fsCv').addEventListener('saved',renderNotes);
$('#homeEd').onclick=e=>{const t=e.target.closest('button[data-a]');if(t&&!t.disabled)edAct(t.dataset.a,t.dataset.id)};
$('#homeEd').onchange=e=>{const t=e.target;if(t.dataset.a&&t.tagName!='BUTTON'){edAct(t.dataset.a,t.dataset.id,t.value);if(t.dataset.a=='c'){const i=t.closest('.ed').querySelector('.ei');if(i)i.style.background=t.value}}};
$('#wb').onclick=e=>{const t=e.target.closest('button[data-a]');if(!t||t.disabled)return;const a=t.dataset.a;
if(a=='del'){const k=decodeURIComponent(t.dataset.t);LS.set('qene.wrong',wrongList().filter(w=>w.t!=k));renderWrong()}
if(a=='clr')ask('確定清空錯題本?').then(y=>{if(y){LS.set('qene.wrong',[]);renderWrong()}});
if(a=='go')startWrong()};
$('#kpEd').onchange=e=>{const t=e.target,a=t.dataset.a;if(!a)return;const c=getKP();
if(a=='cell')c.cells[+t.dataset.i]=t.value;else if(a=='side')c.side=t.value;else if(a=='size')c.size=t.value;
else if(a=='cols'||a=='rows'){const nc=a=='cols'?+t.value:c.cols,nr=a=='rows'?+t.value:c.rows;c.cells=Array.from({length:nc*nr},(_,i)=>{const r=Math.floor(i/nc),q=i%nc;return r<c.rows&&q<c.cols?c.cells[r*c.cols+q]:''});c.cols=nc;c.rows=nr}
else if(['vib','snd'].includes(a))c[a]=t.checked;
S.kpl=c;applySet();renderKpEd()};
$('#kpEd').onclick=e=>{const t=e.target.closest('button[data-a]');if(!t)return;if(t.dataset.a=='reset')S.kpl=null;if(t.dataset.a=='phone')S.kpl={...getKP(),cols:4,rows:4,cells:['1','2','3','bs','4','5','6','clr','7','8','9','-','0','.','/',':']};applySet();renderKpEd()};
/* 按鍵回饋:變色 + 放大提示 + 震動 + 按鍵聲 */
let _kc=null,_kt;const tick=()=>{try{_kc=_kc||new(window.AudioContext||window.webkitAudioContext)();const o=_kc.createOscillator(),g=_kc.createGain();o.frequency.value=1300;g.gain.value=.05;o.connect(g);g.connect(_kc.destination);o.start();o.stop(_kc.currentTime+.025)}catch{}};
$('#kp').addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-k]');if(!b)return;clearTimeout(_kt);const c=getKP();$$('#kp .on').forEach(x=>x!==b&&x.classList.remove('on'));b.classList.add('on');if(c.vib&&navigator.vibrate)navigator.vibrate(8);if(c.snd)tick()});
const kclr=()=>{clearTimeout(_kt);_kt=setTimeout(()=>$$('#kp .on').forEach(b=>b.classList.remove('on')),120)};
document.addEventListener('pointerup',kclr);document.addEventListener('pointercancel',kclr);
$('#wb').onchange=e=>{if(e.target.dataset.a=='f'){wf=e.target.value;renderWrong()}};
S=Object.assign({},DEFS,LS.get('qene.set',{}));applySet();$('#quick .secs').value=S.secs;renderNotes();renderTools();go('home');enhance();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
